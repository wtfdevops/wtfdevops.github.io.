<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>B1 Listening Exam - Mobile Dark Mode</title>
    <style>
        :root {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --inner-bg: #1a202c;
            --primary: #805ad5;
            --text-main: #e2e8f0;
            --text-dim: #a0aec0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 10px; 
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .container { 
            max-width: 100%; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }
        
        h1 { font-size: 1.5rem; text-align: center; }

        .settings-section { 
            background: var(--inner-bg); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #4a5568;
        }

        .setting-item { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        
        select { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #4a5568; 
            background: #2d3748; 
            color: white;
            font-size: 1rem;
            width: 100%;
            appearance: none; /* 移除行動版預設樣式 */
        }

        .btn-start { 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.1rem; 
            width: 100%; 
            touch-action: manipulation;
        }

        /* 導覽網格：在手機上改為彈性排版 */
        .nav-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 5px; 
            margin-bottom: 15px; 
            justify-content: center;
        }
        .nav-item { 
            width: 35px;
            height: 35px;
            line-height: 35px;
            background: var(--inner-bg); 
            border: 1px solid #4a5568; 
            border-radius: 5px; 
            text-align: center; 
            font-size: 0.75rem; 
            color: var(--text-dim);
        }
        .nav-item.active { border: 2px solid #9f7aea; color: white; background: #44337a; }
        .nav-item.correct-nav { background: #22543d; border-color: #38a169; color: #c6f6d5; }
        .nav-item.wrong-nav { background: #742a2a; border-color: #e53e3e; color: #fed7d7; }

        /* 題目卡片 */
        .question-card { 
            background: var(--inner-bg); 
            border-left: 5px solid var(--primary); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            min-height: 100px; 
        }
        
        .question-display { opacity: 0; transition: opacity 0.3s; color: #fff; font-size: 1.2rem; }
        .question-display.revealed { opacity: 1; }
        
        .click-to-reveal { 
            color: #b794f4; 
            text-decoration: underline; 
            margin-bottom: 10px; 
            display: block;
            font-size: 0.9rem;
        }
        
        .explanation-box { 
            display: none; 
            margin-top: 15px; 
            padding: 12px; 
            background: #2a4365; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            color: #bee3f8; 
            border: 1px dashed #63b3ed;
        }
        
        /* 選項按鈕加大 */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .option { 
            padding: 18px; 
            border: 2px solid #4a5568; 
            border-radius: 12px; 
            background: #2d3748; 
            color: #e2e8f0;
            text-align: left; 
            font-size: 1rem;
        }
        
        .correct { background-color: #22543d !important; border-color: #38a169 !important; color: #c6f6d5 !important; }
        .wrong { background-color: #742a2a !important; border-color: #e53e3e !important; color: #fed7d7 !important; }
        
        .replay-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            float: right; 
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .timer-container { width: 100%; background: #4a5568; height: 8px; border-radius: 4px; margin-bottom: 15px; }
        #timer-bar { width: 100%; height: 100%; background: #f687b3; transition: width 1s linear; }

        #quiz-area, #results-area { display: none; }
        .test-btn { background: #4a5568; color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <h1>B1 聽力解析挑戰</h1>
        <div class="settings-section">
            <div class="setting-item">
                <label>1. 選擇口音</label>
                <select id="voice-select"><option>正在載入語音...</option></select>
                <button class="test-btn" onclick="testVoice()">🔊 點此試聽聲</button>
            </div>
            <div class="setting-item">
                <label>2. 語速</label>
                <select id="audio-speed">
                    <option value="0.7">慢速</option>
                    <option value="0.85" selected>正常</option>
                    <option value="1.0">快速</option>
                </select>
            </div>
            <div class="setting-item">
                <label>3. 限時</label>
                <select id="timer-setting">
                    <option value="10">10 秒</option>
                    <option value="15" selected>15 秒</option>
                    <option value="30">30 秒</option>
                </select>
            </div>
        </div>
        <button class="btn-start" onclick="startQuiz()">開始挑戰</button>
    </div>

    <div id="quiz-area">
        <div class="timer-container"><div id="timer-bar"></div></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.9rem;">
            <span>正確率：<span id="accuracy">0</span>%</span>
            <span id="topic-label" style="color:#d6bcfa; font-weight:bold;"></span>
        </div>
        <div class="nav-grid" id="nav-grid"></div>
        
        <div class="question-card">
            <button class="replay-btn" onclick="replayAudio()">🔊</button>
            <div id="reveal-prompt" class="click-to-reveal" onclick="revealText()">👁️ 點擊顯示問題與解析</div>
            <div style="min-height: 1.5em;"><span id="question-text" class="question-display"></span></div>
            <div id="explanation-text" class="explanation-box"></div>
        </div>

        <div class="options-grid" id="options-container"></div>
        <button id="next-btn" class="btn-start" style="margin-top:20px; display:none;" onclick="moveNext()">下一題 ➔</button>
    </div>

    <div id="results-area">
        <h1 style="text-align:center;">測驗完成</h1>
        <div style="font-size: 4rem; color: #9f7aea; text-align:center; font-weight: bold; margin: 20px 0;"><span id="final-percent">0</span>%</div>
        <button class="btn-start" onclick="location.reload()">重新開始</button>
    </div>
</div>

<script>
// 題目數據（同前，包含解析）
const grammarPoints = ["Past Simple Tense", "Future Tense", "Expressing Preferences", "Giving Reasons", "Quantifying / Duration", "Present Perfect", "Present Tense"];
let questions = [
    {q: "What did you eat for dinner last night?", a: "Past Simple Tense", t: "Experiences", e: "解析：句中使用了 'did' 和 'last night'，這是過去簡單式的典型時間標誌。"},
    {q: "Where will you go for your next summer holiday?", a: "Future Tense", t: "Plans", e: "解析：句中使用了 'will' 和 'next summer'，表示對未來的計劃或預測。"},
    {q: "Do you prefer tea or coffee in the morning?", a: "Expressing Preferences", t: "Daily Life", e: "解析：句中使用了 'prefer A or B'，這是在詢問對象的喜好偏好。"},
    {q: "Why do you like living in your city?", a: "Giving Reasons", t: "Opinion", e: "解析：以 'Why' 開頭的問句通常要求回答原因 (Giving Reasons)。"},
    {q: "How many hours a day do you spend on your phone?", a: "Quantifying / Duration", t: "Habits", e: "解析：'How many hours' 用於詢問時間的長短或數量 (Duration)。"},
    {q: "Have you ever seen a famous singer live?", a: "Present Perfect", t: "Experiences", e: "解析：'Have you ever + 過去分詞' 是現在完成式，用於詢問過往的人生經歷。"},
    {q: "How often do you visit your grandparents?", a: "Present Tense", t: "Family", e: "解析：'How often' 詢問頻率，配合 'do you visit' 表示目前的一般習慣。"},
    {q: "When did you buy your first car?", a: "Past Simple Tense", t: "Transport", e: "解析：'did you buy' 指向過去的一個特定時間點。"},
    {q: "Are you going to celebrate your birthday next month?", a: "Future Tense", t: "Special Occasions", e: "解析：'be going to' 用於表示已經決定好的未來打算。"},
    {q: "Would you rather travel by plane or by boat?", a: "Expressing Preferences", t: "Transport", e: "解析：'Would you rather' 是表達偏好的常用語法。"},
    {q: "Why is it important to learn a musical instrument?", a: "Giving Reasons", t: "Music", e: "解析：詢問重要性及原因，屬於 Giving Reasons。"},
    {q: "How long have you lived in your current house?", a: "Quantifying / Duration", t: "Personal", e: "解析：'How long' 詢問持續時間的長度。"},
    {q: "Has your family ever visited a traditional festival abroad?", a: "Present Perfect", t: "Festivals", e: "解析：使用 'Has... ever' 詢問截至目前為止的經驗。"},
    {q: "What time do you usually wake up on Saturdays?", a: "Present Tense", t: "Routine", e: "解析：'usually' 加上現在式動詞，描述日常規律或習慣。"},
    {q: "Who was your favorite teacher when you were at school?", a: "Past Simple Tense", t: "Education", e: "解析：'was' 和 'were' 顯示這是在談論過去的事實。"},
    {q: "Will you take the bus to work tomorrow morning?", a: "Future Tense", t: "Transport", e: "解析：'Will' 和 'tomorrow' 明顯指向未來。"},
    {q: "Do you like pop music more than rock music?", a: "Expressing Preferences", t: "Music", e: "解析：比較兩者並詢問喜好。"},
    {q: "Why do people enjoy watching fireworks at New Year?", a: "Giving Reasons", t: "Festivals", e: "解析：'Why' 詢問行為背後的動機或原因。"},
    {q: "How many kilometers is your commute to the office?", a: "Quantifying / Duration", t: "Transport", e: "解析：詢問具體的數量/距離。"},
    {q: "Have you ever won a prize at a wedding game?", a: "Present Perfect", t: "Special Occasions", e: "解析：詢問過往是否有過某種特定的經驗。"},
    {q: "Which radio station do you listen to in the car?", a: "Present Tense", t: "Media", e: "解析：詢問目前的習慣性行為。"},
    {q: "Did you receive many gifts on your last birthday?", a: "Past Simple Tense", t: "Special Occasions", e: "解析：'Did' 搭配 'last birthday' 指向過去事件。"},
    {q: "What are you going to wear to the wedding on Sunday?", a: "Future Tense", t: "Special Occasions", e: "解析：'are you going to' 表示未來的安排。"},
    {q: "Do you prefer watching horror movies or comedies?", a: "Expressing Preferences", t: "Entertainment", e: "解析：詢問在兩種電影類型之間的選擇。"},
    {q: "Why is public transport better than driving a car?", a: "Giving Reasons", t: "Transport", e: "解析：詢問支持某種觀點的原因。"},
    {q: "How many days did you spend at the local festival?", a: "Quantifying / Duration", t: "Festivals", e: "解析：'How many days' 用於量化一段時間。"},
    {q: "Have you ever traveled on a high-speed train?", a: "Present Perfect", t: "Transport", e: "解析：詢問關於交通工具的搭乘經驗。"},
    {q: "How do you usually spend your Sunday afternoons?", a: "Present Tense", t: "Routine", e: "解析：詢問例行公事。"},
    {q: "What was the most memorable trip you took as a child?", a: "Past Simple Tense", t: "Travel", e: "解析：'was' 顯示這是在談論兒時的過去回憶。"},
    {q: "Are you going to stay at home or go out tonight?", a: "Future Tense", t: "Plans", e: "解析：詢問今晚即將發生的計劃。"},
    {q: "Would you prefer to learn the violin or the drums?", a: "Expressing Preferences", t: "Hobbies", e: "解析：'Would prefer' 用於詢問假設性或具體的選擇。"},
    {q: "Why do you think music is important for celebrations?", a: "Giving Reasons", t: "Culture", e: "解析：要求解釋對音樂重要性的看法原因。"},
    {q: "How many guests are you inviting to the party?", a: "Quantifying / Duration", t: "Party", e: "解析：詢問賓客的數量。"},
    {q: "Have you ever been to a film festival in another city?", a: "Present Perfect", t: "Festivals", e: "解析：詢問是否有到過某處的經驗。"},
    {q: "Do you use the subway every day to get to school?", a: "Present Tense", t: "Transport", e: "解析：'every day' 是現在式常用的頻率副詞。"},
    {q: "What did you do during the last national holiday?", a: "Past Simple Tense", t: "Holiday", e: "解析：'did you do' 指向前一次假期的活動。"},
    {q: "Will you learn a new language next year?", a: "Future Tense", t: "Learning", e: "解析：'next year' 與 'Will' 搭配表示未來意圖。"},
    {q: "Do you prefer traditional food or modern snacks?", a: "Expressing Preferences", t: "Food", e: "解析：在食物種類間進行喜好選擇。"},
    {q: "Why is it necessary to have a car in the countryside?", a: "Giving Reasons", t: "Living", e: "解析：尋求對鄉村生活必需品的原因解釋。"},
    {q: "How many hours was the flight to your last destination?", a: "Quantifying / Duration", t: "Travel", e: "解析：量化過去某次飛行的時間。"},
    {q: "Have you ever met a famous actor at the cinema?", a: "Present Perfect", t: "Media", e: "解析：詢問過往奇特的個人經歷。"},
    {q: "Does your city have many music venues?", a: "Present Tense", t: "City Life", e: "解析：詢問關於現狀的事實。"},
    {q: "How did you celebrate your graduation from university?", a: "Past Simple Tense", t: "Education", e: "解析：詢問過去特定事件（畢業）的慶祝方式。"},
    {q: "What will the weather be like for the outdoor concert?", a: "Future Tense", t: "Weather", e: "解析：'will... be' 用於預測未來天氣。"},
    {q: "Do you prefer attending big concerts or small gigs?", a: "Expressing Preferences", t: "Music", e: "解析：詢問對演唱會規模的偏好。"},
    {q: "Why is it fun to exchange gifts during festivals?", a: "Giving Reasons", t: "Tradition", e: "解析：探討節日行為背後的理由。"},
    {q: "How many months did it take you to learn that song?", a: "Quantifying / Duration", t: "Music", e: "解析：詢問完成某事所需的累積時間。"},
    {q: "Have you ever forgotten a close friend's birthday?", a: "Present Perfect", t: "Social", e: "解析：詢問是否有過某種失誤的經歷。"},
    {q: "What kind of TV shows do you watch after dinner?", a: "Present Tense", t: "Media", e: "解析：詢問晚上的日常習慣。"},
    {q: "Where did you go on your very first plane trip?", a: "Past Simple Tense", t: "Travel", e: "解析：詢問人生的第一次經驗，發生在過去。"}
];

let voices = [];
let currentIndex = 0;
let userAnswers = [];
let timerInterval;

// 手機語音引擎載入
function initVoices() {
    voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    const select = document.getElementById('voice-select');
    if (voices.length > 0) {
        select.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name}</option>`).join('');
    }
}
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
}
initVoices();

function testVoice() { speak("Hello! This is a test for my accent."); }

function speak(text) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    const vIdx = document.getElementById('voice-select').value;
    if (voices[vIdx]) msg.voice = voices[vIdx];
    msg.rate = parseFloat(document.getElementById('audio-speed').value);
    window.speechSynthesis.speak(msg);
}

function startQuiz() {
    // 隨機打亂
    for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
    }
    userAnswers = Array(questions.length).fill(null);
    document.getElementById('setup-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    renderNav();
    loadQuestion(0);
}

function renderNav() {
    const nav = document.getElementById('nav-grid');
    nav.innerHTML = questions.map((_, i) => {
        let cls = 'nav-item' + (i === currentIndex ? ' active' : '') + (userAnswers[i] === true ? ' correct-nav' : userAnswers[i] === false ? ' wrong-nav' : '');
        return `<div class="${cls}">${i+1}</div>`;
    }).join('');
}

function loadQuestion(index) {
    clearInterval(timerInterval);
    currentIndex = index;
    renderNav();
    const q = questions[index];
    
    document.getElementById('topic-label').innerText = q.t;
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('question-text').innerText = "";
    document.getElementById('question-text').classList.remove('revealed');
    document.getElementById('explanation-text').style.display = 'none';
    document.getElementById('reveal-prompt').style.display = 'block';

    const container = document.getElementById('options-container');
    container.innerHTML = grammarPoints.map(pt => {
        let cls = 'option';
        if (userAnswers[index] !== null) {
            if (pt === q.a) cls += ' correct';
            else if (userAnswers[index] === false) cls += ' wrong';
        }
        return `<div class="${cls}" onclick="handleChoice(this, '${pt}', '${q.a}')">${pt}</div>`;
    }).join('');

    if (userAnswers[index] === null) startTimer();
    else revealText();
    
    // 手機延遲播放確保穩定
    setTimeout(() => speak(q.q), 100);
}

function revealText() {
    const q = questions[currentIndex];
    const qEl = document.getElementById('question-text');
    qEl.innerText = q.q;
    qEl.classList.add('revealed');
    document.getElementById('explanation-text').innerText = q.e;
    document.getElementById('explanation-text').style.display = 'block';
    document.getElementById('reveal-prompt').style.display = 'none';
}

function replayAudio() { speak(questions[currentIndex].q); }

function startTimer() {
    const max = parseInt(document.getElementById('timer-setting').value);
    let left = max;
    const bar = document.getElementById('timer-bar');
    bar.style.transition = 'none'; 
    bar.style.width = '100%';
    
    timerInterval = setInterval(() => {
        left--;
        bar.style.transition = 'width 1s linear';
        bar.style.width = (left / max * 100) + '%';
        if (left <= 0) { 
            clearInterval(timerInterval); 
            handleChoice(null, "TIMEOUT", questions[currentIndex].a); 
        }
    }, 1000);
}

function handleChoice(el, selected, correct) {
    if (userAnswers[currentIndex] !== null) return;
    clearInterval(timerInterval);
    userAnswers[currentIndex] = (selected === correct);
    revealText();
    renderNav();
    updateStats();
    
    document.querySelectorAll('.option').forEach(opt => {
        if(opt.innerText === correct) opt.classList.add('correct');
        if(opt.innerText === selected && selected !== correct) opt.classList.add('wrong');
    });
    
    document.getElementById('next-btn').style.display = 'block';
    speak(selected === correct ? "Correct" : "Correct answer is " + correct);
}

function updateStats() {
    const ans = userAnswers.filter(a => a !== null).length;
    const cor = userAnswers.filter(a => a === true).length;
    document.getElementById('accuracy').innerText = ans === 0 ? 0 : Math.round((cor/ans)*100);
}

function moveNext() {
    if (currentIndex < questions.length - 1) loadQuestion(currentIndex + 1);
    else {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('results-area').style.display = 'block';
        document.getElementById('final-percent').innerText = document.getElementById('accuracy').innerText;
    }
}
</script>
</body>
</html>
