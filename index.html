<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>B1 Trinity GESE Practice</title>
  <style>
    :root { --primary: #2563EB; --primary-dk: #1D4ED8; --bg: #F1F5F9; --surface: #FFFFFF; --text: #1E293B; --danger: #EF4444; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
    .app-container { width: 100%; max-width: 540px; background: var(--surface); padding: 24px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.09); min-height: 640px; display: flex; flex-direction: column; }
    .view { display: none; flex-direction: column; flex-grow: 1; }
    .view.active { display: flex; }
    .btn { width: 100%; padding: 14px; border-radius: 9px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; background: var(--primary); margin-top: 10px; }
    .chat-box { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px; border: 1px solid #E2E8F0; margin: 10px 0; }
    .msg { padding: 12px; border-radius: 14px; font-size: 14.5px; max-width: 85%; }
    .examiner { background: #E0F2FE; align-self: flex-start; }
    .user { background: var(--primary); color: #fff; align-self: flex-end; }
    .mic-btn { width: 68px; height: 68px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 24px; cursor: pointer; align-self: center; display: flex; align-items: center; justify-content: center; }
    .mic-btn:disabled { background: #94A3B8; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="view active" id="viewDashboard">
    <h1>B1 Trinity GESE Practice</h1>
    <label>Examiner Gender</label>
    <select id="examinerGender">
      <option value="male">🧔 Male Voice</option>
      <option value="female" selected>👩 Female Voice</option>
    </select>
    <button class="btn" onclick="startExamSession()">Start Session</button>
  </div>

  <div class="view" id="viewChat">
    <div id="examTimer" style="text-align:center; font-weight:bold;">00:00</div>
    <div class="chat-box" id="chatBox"></div>
    <button class="mic-btn" id="micBtn" onclick="handleMicClick()">🎙️</button>
    <button class="btn" id="finishExamBtn" style="display:none" onclick="finishExam()">Finish & Grade</button>
  </div>

  <div class="view" id="viewScoring">
    <select id="reportLangSelect">
      <option value="both">Both (英+中)</option>
      <option value="en">English Only</option>
      <option value="zh">Traditional Chinese Only</option>
    </select>
    <div id="scoringContent" style="flex-grow:1; overflow-y:auto; padding:10px;"></div>
    <button class="btn" onclick="location.reload()">Back to Home</button>
  </div>
</div>

<script>
  let history = [], examTimeSeconds = 0, targetTimeLimit = 660, chosenGender = 'female';
  let audioSynthesizer = window.speechSynthesis;

  function speakOutputText(text, callback) {
    audioSynthesizer.cancel();
    const utt = new SpeechSynthesisUtterance(text.replace(/SYSTEM_CONFIG:.*$/gi, ''));
    let voices = audioSynthesizer.getVoices();
    let matched = (chosenGender === 'male') 
      ? voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('daniel'))
      : voices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('hazel'));
    if (matched) utt.voice = matched;
    utt.onend = () => callback();
    audioSynthesizer.speak(utt);
  }

  async function executeExaminerTurn() {
    document.getElementById('micBtn').disabled = true;
    let isFinalRound = (examTimeSeconds >= targetTimeLimit);
    let prompt = [...history];
    if (isFinalRound) prompt.push({ role: 'user', parts: [{ text: "TIME_UP: Conclude the test now." }] });

    const data = await fetch('https://b1-trinity.jingplus.workers.dev/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dailyPassword: 'demo', payload: { contents: prompt } })
    }).then(r => r.json());

    const resText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    history.push({ role: 'model', parts: [{ text: resText }] });
    document.getElementById('chatBox').innerHTML += `<div class="msg examiner">${resText}</div>`;

    speakOutputText(resText, () => {
      if (resText.toLowerCase().includes("end of the test")) {
        document.getElementById('micBtn').style.display = 'none';
        document.getElementById('finishExamBtn').style.display = 'block';
      } else {
        document.getElementById('micBtn').disabled = false;
      }
    });
  }

  async function performScoring() {
    const contentDiv = document.getElementById('scoringContent');
    contentDiv.innerHTML = "Analyzing...";
    try {
      const data = await fetch('https://b1-trinity.jingplus.workers.dev/grade', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: history })
      }).then(r => r.json());
      contentDiv.innerHTML = data.report || "No report generated.";
    } catch (e) {
      contentDiv.innerHTML = `<button class="btn" onclick="performScoring()">Retry Analysis</button>`;
    }
  }

  function startExamSession() {
    chosenGender = document.getElementById('examinerGender').value;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('viewChat').classList.add('active');
    setInterval(() => { examTimeSeconds++; }, 1000);
    executeExaminerTurn();
  }

  function finishExam() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('viewScoring').classList.add('active');
    performScoring();
  }
</script>
</body>
</html>
