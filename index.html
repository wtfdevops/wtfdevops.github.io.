<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>B1 Trinity GESE Practice</title>
  <style>
    :root { --primary: #2563EB; --primary-dk: #1D4ED8; --primary-lt: #EFF6FF; --ph2: #7C3AED; --ph2-lt: #F5F3FF; --success: #10B981; --danger: #EF4444; --warn: #F59E0B; --bg: #F1F5F9; --surface: #FFFFFF; --surface2: #F8FAFC; --text: #1E293B; --muted: #64748B; --border: #E2E8F0; --ex-bubble: #E0F2FE; --shadow: 0 4px 14px rgba(0,0,0,.09); --radius: 14px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .app-container { width: 100%; max-width: 540px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; display: flex; flex-direction: column; min-height: 640px; }
    .view { display: none; flex-direction: column; flex-grow: 1; }
    .view.active { display: flex; }
    .label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
    input, select { width: 100%; padding: 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; margin-bottom: 15px; }
    .btn { width: 100%; padding: 14px; border-radius: 9px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; background: var(--primary); margin-top: 10px; }
    .chat-box { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border); max-height: 350px; }
    .msg { max-width: 85%; padding: 12px; border-radius: 14px; font-size: 14.5px; }
    .msg.examiner { background: var(--ex-bubble); align-self: flex-start; }
    .msg.user { background: var(--primary); color: #fff; align-self: flex-end; }
    .mic-btn { width: 68px; height: 68px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 24px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
    .mic-btn:disabled { background: #94A3B8; cursor: not-allowed; }
    .mic-btn.recording { background: var(--danger); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 100% { box-shadow: 0 0 0 15px rgba(239,68,68,0); } }
  </style>
</head>
<body>

  <div class="app-container">
    <header><h1>🇬🇧 B1 GESE Practice</h1></header>

    <div class="view active" id="viewDashboard">
      <label class="label">Examiner Gender</label>
      <select id="examinerGender">
        <option value="male">🧔 Male Voice</option>
        <option value="female" selected>👩 Female Voice</option>
      </select>
      <button class="btn" onclick="startExamSession()">Start Session</button>
    </div>

    <div class="view" id="viewChat">
      <div id="examTimer" style="font-weight:bold; font-family:monospace; text-align:center; margin-bottom:10px;">00:00</div>
      <div class="chat-box" id="chatBox"></div>
      <div style="text-align:center">
        <div id="statusText">Initialising...</div>
        <button class="mic-btn" id="micBtn" onclick="handleMicClick()">🎙️</button>
        <button class="btn" id="finishExamBtn" style="display:none" onclick="location.reload()">Finish & Grade</button>
      </div>
    </div>

    <div class="view" id="viewScoring">
      <select id="reportLangSelect">
        <option value="both">Both (英+中)</option>
        <option value="en">English Only</option>
        <option value="zh">Traditional Chinese Only</option>
      </select>
      <div id="scoringContent" style="flex-grow:1; overflow-y:auto"></div>
      <button class="btn" onclick="location.reload()">Back to Home</button>
    </div>
  </div>

  <script>
    let history = [], examTimeSeconds = 0, targetTimeLimit = 660, isRecording = false, audioSynthesizer = window.speechSynthesis;
    let chosenGender = 'female';

    // 核心修正：強制男聲鎖定
    function speakOutputText(text, callback) {
      audioSynthesizer.cancel();
      const utt = new SpeechSynthesisUtterance(text.replace(/SYSTEM_CONFIG:.*$/gi, ''));
      let voices = audioSynthesizer.getVoices();
      
      let matchedVoice = null;
      if (chosenGender === 'male') {
        matchedVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('george') || v.name.toLowerCase().includes('daniel'));
      } else {
        matchedVoice = voices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('hazel') || v.name.toLowerCase().includes('susan'));
      }
      if (matchedVoice) utt.voice = matchedVoice;
      
      utt.onend = () => callback();
      audioSynthesizer.speak(utt);
    }

    async function executeExaminerTurn() {
      document.getElementById('micBtn').disabled = true;
      let isFinalRound = (examTimeSeconds >= targetTimeLimit);
      
      let currentPrompt = [...history];
      if (isFinalRound) {
         currentPrompt.push({ role: 'user', parts: [{ text: "TIME_UP: You must now conclude the test by saying: 'Thank you very much. That is the end of the test.'" }] });
      }

      const data = await fetch('https://b1-trinity.jingplus.workers.dev/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dailyPassword: 'demo', payload: { contents: currentPrompt } })
      }).then(r => r.json());

      const resText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      history.push({ role: 'model', parts: [{ text: resText }] });
      document.getElementById('chatBox').innerHTML += `<div class="msg examiner">${resText}</div>`;

      speakOutputText(resText, () => {
        if (resText.toLowerCase().includes("end of the test")) {
            document.getElementById('micBtn').style.display = 'none';
            document.getElementById('finishExamBtn').style.display = 'block';
        } else {
            document.getElementById('micBtn').style.display = 'flex';
            document.getElementById('micBtn').disabled = false;
        }
      });
    }

    function startExamSession() {
      chosenGender = document.getElementById('examinerGender').value;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('viewChat').classList.add('active');
      
      setInterval(() => { examTimeSeconds++; }, 1000);
      executeExaminerTurn();
    }
  </script>
</body>
</html>
